<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 3 - Componente</title>
    <link rel="stylesheet" href="css/componente.css">
</head>
<body>
    <div class="carrusel">
        <div class="carrusel-track" id="track">
            <div class="carrusel-slide">
                <img src="img/snoopy1.jpg" alt="snoopy 1">
            </div>
            <div class="carrusel-slide">
                <img src="img/snoopy6.jpg" alt="snoopy 2">
            </div>
            <div class="carrusel-slide">
                <img src="img/snoopy3.jpg" alt="snoopy 3">
            </div>
            <div class="carrusel-slide">
                <img src="img/snoopy4.jpg" alt="snoopy 4">
            </div>
            <div class="carrusel-slide">
                <img src="img/snoopy5.jpg" alt="snoopy 5">
            </div>
        </div>

        <button class="carrusel-btn btn-prev" id="btnPrev">&#10094;</button>
        <button class="carrusel-btn btn-next" id="btnNext">&#10095;</button>
    </div>

    <div class="carrusel-progress-container">
        <div class="carrusel-progress-bar" id="progressBar"></div>
    </div>

    <script src="js/componente.js"></script>
</body>
</html>
